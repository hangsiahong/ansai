# Runs on every push: the type check, the tests, and the browser smoke test.
name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests that make Git commits need a name to commit as.
      GIT_AUTHOR_NAME: ansai checks
      GIT_AUTHOR_EMAIL: checks@example.com
      GIT_COMMITTER_NAME: ansai checks
      GIT_COMMITTER_EMAIL: checks@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install tmux (agents and shells run in it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Build the web app (the smoke test then runs against it, as it does in a release)
        run: bun scripts/build-web.ts "dist/web/$(git rev-parse HEAD)"
      - name: Install a browser for the smoke test
        run: bunx playwright-core install --with-deps chromium
      - name: Browser smoke test (phone and desktop sizes)
        run: bun run smoke
      - name: Keep the smoke test's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/ansai-smoke-*/shots
          if-no-files-found: ignore
